# Checks every pull request and push, and deploys the docs site to
# Cloudflare from main.
#
# `check` runs the same `pnpm check` and `pnpm test` as the pre-commit hook.
#
# `deploy` runs on every push to main after `check`: it builds the docs, which
# prerenders every page, and uploads apps/docs/dist/client as the Worker's
# static assets. It needs the CLOUDFLARE_API_TOKEN (made from the "Edit
# Cloudflare Workers" template, which covers the custom-domain route on the
# zone) and CLOUDFLARE_ACCOUNT_ID repository secrets, set on the upload step
# alone, out of reach of install scripts. Deploys never run concurrently or
# get cancelled, so the newest push is always the one that ends up live.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test -- --run

  deploy:
    name: Deploy the docs to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload the site
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
